<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel=icon type="image/png" href="FAVICON.png"> 
    <title>chopstx</title>
  <style>
.box-element {
    display: inline-block;
  transition: transform 0.1s ease;
}
.spinning {
  animation: spin 1s linear infinite; 
}
@keyframes spin {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
}
</style>
</head>
<body>
<h1>chopstx's website</h1>
<h4 class="box-element">spinning text</h4>
<button id="spin-button">Spin Text</button>
<button id="stop-button">Stop Text</button>
</body>
<script>
const spin = document.getElementById("spin-button");
const stop = document.getElementById("stop-button");
spin.addEventListener("click", let spin = true);
stop.addEventLister("click", let spin = false);
if (spin = true) {
box-element.classList.add('spinning');
}   else {
  box-element.classList.remove('spinning');
}
    
</script>
</html>
